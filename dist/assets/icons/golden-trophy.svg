  <path d="M398 51L402 65L416 69L402 73L398 87L394 73L380 69L394 65L398 51Z" fill="#FFE697"/>
  <path d="M105 265L108 275L118 278L108 281L105 291L102 281L92 278L102 275L105 265Z" fill="#FFD558"/>
