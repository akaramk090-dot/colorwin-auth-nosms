<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Limbo Rocket Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#05070e;color:white;font-family:Arial,sans-serif}.top{height:64px;background:#080a10;display:flex;align-items:center;justify-content:space-between;padding:0 15px;gap:10px}.back{font-size:29px}.wallet{border:1px solid #3c5fbc;border-radius:28px;background:linear-gradient(100deg,#12224e,#264aaf);padding:10px 13px;font-size:17px;white-space:nowrap}.plus{border:1px solid #3555ad;border-radius:12px;padding:9px;font-size:21px}.shell{max-width:650px;margin:8px auto;background:linear-gradient(130deg,#182c4d,#10223c 55%,#1c2d52);border:2px solid #334b81;border-radius:19px;overflow:hidden}.heading{text-align:center;font-weight:800;margin:16px 0 25px}.hash{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:13px;padding:0 9px;white-space:nowrap}.hash span{overflow:hidden;text-overflow:ellipsis}.hash button,.history button{background:#304b9e;color:#fff;border:1px solid #5b76c2;border-radius:25px;padding:7px 12px}.history{margin:27px 7px 0;background:#101d35;border-radius:12px;display:flex;gap:6px;padding:5px;min-height:39px;overflow:hidden;align-items:center}.chip{flex-shrink:0;background:#e04466;border-radius:6px;padding:5px 9px;font-size:14px}.chip.win{background:#28bb7a}.history button{margin-left:auto}.space{position:relative;height:min(59vh,530px);min-height:350px;overflow:hidden;background:radial-gradient(ellipse at 55% 90%,#24568b44,transparent 55%)}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#c6e7ff;opacity:.7}.planet{position:absolute;border-radius:50%;box-shadow:inset -13px -12px 14px #07152b77}.p1{width:83px;height:83px;left:-12px;top:37%;background:radial-gradient(circle at 28% 28%,#79b2e1,#315a8c)}.p2{width:43px;height:43px;right:7%;top:8%;background:radial-gradient(circle at 28% 28%,#ad6577,#50385e)}.result{position:absolute;z-index:3;top:16%;width:100%;text-align:center;font-weight:900;font-size:clamp(44px,11vw,68px);color:#e34665;text-shadow:0 3px 15px #09162b}.result.win{color:#2cc883}.rocket{position:absolute;width:155px;height:185px;left:50%;bottom:12%;transform:translateX(-50%);z-index:2;transition:bottom .75s ease,transform .75s ease}.rocket.fly{bottom:35%;transform:translateX(-50%) scale(.83)}.rocket svg{width:100%;height:100%;filter:drop-shadow(0 8px 12px #03081799)}.rocket.fly .fire{animation:flame .13s infinite alternate;transform-origin:50% 76%}@keyframes flame{to{transform:scaleY(1.3)}}.ground{position:absolute;bottom:-18px;width:110%;left:-5%;height:108px;background:linear-gradient(#44638d,#193557);border-radius:48% 50% 0 0;box-shadow:0 -15px 38px #428bba55}.ground:before{content:"";position:absolute;left:10%;top:20%;width:40%;height:20px;border-radius:50%;background:#263e63}.target{display:flex;justify-content:center;align-items:center;gap:12px;position:absolute;bottom:12px;z-index:4;width:100%}.round{border-radius:50%;width:36px;height:36px;background:#30499a;color:#fff;border:1px solid #647ac4;font-size:23px}.target input{width:125px;text-align:center;background:#142345;color:white;border:1px solid #354a8b;border-radius:24px;padding:7px;font-size:20px}.controls{background:#101b36;border-radius:18px 18px 0 0;padding:20px 14px 24px}.betbox{display:flex;align-items:center;gap:9px;justify-content:center;background:#29448f;border-radius:40px;padding:8px;margin:0 auto 20px;max-width:460px}.betlabel{flex:1;text-align:center}.betlabel small{display:block;font-size:15px}.betlabel input{width:100%;min-width:60px;background:#122247;border:1px solid #13203c;border-radius:25px;color:#fff;text-align:center;padding:8px;font-size:17px}.betbox button{width:42px;height:42px;border-radius:50%;background:#25417f;color:white;border:1px solid #5c76b7;font-size:23px}.actions{display:flex;gap:12px;max-width:460px;margin:auto}.auto{background:#0965c5;color:white;border:2px solid #234f92;border-radius:50%;width:58px;height:58px;font-size:27px}.play{flex:1;background:linear-gradient(90deg,#248a04,#3fbc00);border:2px solid #182b1a;color:white;border-radius:23px;font-size:22px}.play:disabled{opacity:.6}.foot{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#243c68;font-size:13px}.notice{text-align:center;font-size:12px;color:#a9b8d2;padding:8px}.toast{position:fixed;z-index:20;left:50%;top:45%;transform:translate(-50%,-50%);padding:18px 26px;border-radius:16px;background:#142c4b;border:2px solid #4768a0;box-shadow:0 10px 40px #000a;display:none;text-align:center;font-size:19px;min-width:220px}.toast.show{display:block}@media(min-width:650px){.space{height:530px}}
body{overflow-x:hidden}button:focus-visible,input:focus-visible{outline:2px solid #67b6ff;outline-offset:2px}@media(max-width:430px){.shell{margin:8px;border-width:1px}.wallet{font-size:13px}.space{height:340px;min-height:300px}.heading{margin:12px 0}.history{margin-top:16px}.controls{padding:14px 10px}.betbox{margin-bottom:12px}.hash{font-size:11px}.top{height:50px}.rocket{width:125px;height:155px}}</style></head><body><div class="top"><div class="back">‹</div><div class="wallet">🪙 ₹<span id="balance">—</span></div><span>🌐</span></div><main class="shell"><div class="heading">LIMBO</div><div class="hash"><span>Round ID: <span id="hash">Ready for the next round</span></span><button id="copy">▢</button><button id="refresh">⟳</button></div><div class="history" id="history"></div><section class="space" id="space"><div class="planet p1"></div><div class="planet p2"></div><div class="result" id="result">LIMBO</div><div class="rocket" id="rocket"><svg viewBox="0 0 160 190" xmlns="http://www.w3.org/2000/svg"><g class="fire"><path d="M63 130 Q52 162 80 188 Q107 162 97 130" fill="#ff8a16"/><path d="M70 130 Q65 158 80 177 Q96 157 90 130" fill="#ffe66c"/></g><path d="M53 100 Q26 113 23 147 L55 134Z" fill="#d44c53"/><path d="M107 100 Q134 113 137 147 L105 134Z" fill="#d44c53"/><path d="M80 9 Q38 36 48 121 L60 142 L100 142 L112 121 Q122 36 80 9" fill="#c5d7eb" stroke="#6780a6" stroke-width="4"/><path d="M80 9 Q62 21 54 42 L106 42 Q98 21 80 9" fill="#e95d61"/><path d="M49 55 Q80 44 111 55 L111 69 Q80 59 49 69" fill="#4776b1"/><rect x="62" y="68" width="36" height="29" rx="12" fill="#172940" stroke="#7b9cc0" stroke-width="5"/><path d="M63 125 L97 125 L101 144 L59 144Z" fill="#34475f"/><path d="M80 91 L75 107 L80 119 L85 107Z" fill="#ee5957"/></svg></div><div class="ground"></div><div class="target"><button class="round" id="tm">−</button><input type="number" id="target" value="3.00" min="1.01" step="0.1" inputmode="decimal" aria-label="Target multiplier"><button class="round" id="tp">+</button></div></section><section class="controls"><div class="betbox"><div class="betlabel"><small>Bet</small><input type="number" id="bet" value="100.00" min="1" step="1" inputmode="decimal" aria-label="Bet amount"></div><button id="bm">−</button><button id="half">½</button><button id="bp">+</button></div><div class="actions"><button class="auto" id="auto" title="Auto play">⟳</button><button class="play" id="play">▷ &nbsp; BET</button></div></section><div class="foot"><span>ⓘ Color Win wallet</span><span id="bottomBalance">— INR</span></div></main><div class="notice">Color Win wallet · Bet ₹1–₹10,000 · Target 1.01–10,000x</div><div class="toast" id="toast"></div><script src="arcade-client.js?v=1"></script><script>
const $=id=>document.getElementById(id);let balance=null,busy=true,auto=false,rounds=0,key=null;const money=n=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function popup(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800);}
function update(d){balance=Number(d.balance);$('balance').textContent=money(balance);$('bottomBalance').textContent=money(balance)+' INR';$('history').innerHTML=(d.history||[]).slice(0,8).map(r=>'<span class="chip '+(r.status==='cashed'?'win':'')+'">'+Number(r.result).toFixed(2)+'x</span>').join('');}
function controls(){for(const id of ['play','bet','target','tm','tp','bm','bp','half'])$(id).disabled=busy||balance===null;}
async function load(){try{update(await CWArcade('limbo','load'));}catch(e){popup(e.message);}finally{busy=false;controls();}}
async function play(){if(busy)return;const amount=Number($('bet').value),target=Number($('target').value);if(!Number.isFinite(amount)||amount<1||amount>10000||amount>balance||!Number.isFinite(target)||target<1.01||target>10000){popup('Check wallet, bet and target amounts.');auto=false;return;}busy=true;controls();key=key||crypto.randomUUID();$('rocket').classList.add('fly');$('result').textContent='…';try{const d=await CWArcade('limbo','bet',{amount,target,request_id:key});key=null;update(d);const r=d.round;$('result').textContent=Number(r.result).toFixed(2)+'x';$('result').className='result'+(r.status==='cashed'?' win':'');$('hash').textContent=r.id;popup(r.status==='cashed'?'Cash return ₹'+money(r.payout):'Bet lost ₹'+money(r.amount));rounds++;}catch(e){auto=false;popup(e.message);await load();}finally{$('rocket').classList.remove('fly');busy=false;controls();if(auto&&rounds<100)setTimeout(play,1200);else auto=false;}}
$('play').onclick=()=>{auto=false;play();};$('auto').onclick=()=>{auto=!auto;rounds=0;popup(auto?'Auto play ON':'Auto play OFF');if(auto&&!busy)play();};
$('tm').onclick=()=>{$('target').value=Math.max(1.01,Number($('target').value)-.1).toFixed(2);};$('tp').onclick=()=>{$('target').value=Math.min(10000,Number($('target').value)+.1).toFixed(2);};$('bm').onclick=()=>{$('bet').value=Math.max(1,Number($('bet').value)-10).toFixed(2);};$('bp').onclick=()=>{$('bet').value=Math.min(10000,Number($('bet').value)+10).toFixed(2);};$('half').onclick=()=>{$('bet').value=Math.max(1,Number($('bet').value)/2).toFixed(2);};$('copy').onclick=()=>navigator.clipboard?.writeText($('hash').textContent).then(()=>popup('Copied')).catch(()=>popup('Copy unavailable'));$('refresh').onclick=()=>{if(!busy)load();};for(let i=0;i<36;i++){const star=document.createElement('i');star.className='star';star.style.left=Math.random()*100+'%';star.style.top=Math.random()*85+'%';$('space').append(star);}controls();load();
</script></body></html>
