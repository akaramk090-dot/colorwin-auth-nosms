<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINES HD</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 15%,#1260a3,#04132d 75%);color:#fff;font:15px Arial}main{max-width:460px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;padding:15px 4px}header b{font-size:24px;color:#ffcc36;text-shadow:0 2px #b86b09}.wallet{background:#062448;border:1px solid #3186d7;border-radius:25px;padding:10px}.board{background:linear-gradient(155deg,#1269bd,#053c91);border:4px solid #1685e4;border-radius:17px;padding:12px;box-shadow:0 10px 35px #0009}.top{display:flex;justify-content:space-between;gap:10px;margin-bottom:13px}.top select,.top span{border:1px solid #155ba4;background:#05295c;color:white;border-radius:8px;padding:9px;font-weight:bold}.top select{width:94px;max-width:94px;height:34px;font-size:12px;padding:4px 7px;appearance:auto}.top span{background:#f8b91e;color:#17223c}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tile{aspect-ratio:1;border:2px solid #1658a6;border-radius:9px;background:linear-gradient(145deg,#07244c,#061b3b);box-shadow:inset 0 2px 5px #0009,0 3px #00306e;color:#235f9e;font-size:29px;transition:transform .16s,background .16s}.tile:active{transform:scale(.93)}.tile.open{background:linear-gradient(#ffc44a,#e88d13);border-color:#ffe28c;color:white;text-shadow:0 2px #b66b08}.tile.bomb{background:linear-gradient(#e84e5c,#9e1534);color:white;border-color:#ff9d9d}.tile:disabled{opacity:1}.panel{background:#082e65;border:2px solid #1774c9;border-radius:15px;padding:14px;margin-top:13px}label{display:block;color:#bbd9ff;font-size:12px}input{width:100%;margin:7px 0 10px;background:#031c3d;color:white;border:1px solid #3d7fcb;border-radius:9px;padding:12px;font-size:18px}.actions{display:flex;gap:9px}button.action{flex:1;padding:15px 8px;border:0;border-radius:10px;font-weight:900;color:#fff;background:linear-gradient(#25d17a,#06844a)}button.cash{background:linear-gradient(#ffcf36,#e48b06);color:#372407}button:disabled{opacity:.5}#message{text-align:center;min-height:27px;color:#ffdb6b;font-weight:bold;margin:13px 0}footer{text-align:center;color:#91b6dd;font-size:11px;padding:15px}.mine-select{position:relative}.mine-select>button{background:#073d8c;color:#fff;border:1px solid #4ba3ff;border-radius:7px;padding:7px 10px;min-width:51px;font-weight:bold}.mine-options{position:absolute;top:38px;left:0;z-index:30;width:115px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:#063776;border:1px solid #42a4ff;border-radius:9px;padding:6px;box-shadow:0 6px 18px #0009}.mine-options[hidden]{display:none}.mine-options button{background:#12549b;border:0;border-radius:5px;color:white;padding:8px 2px;font-size:13px}.mine-options button.chosen{background:#f4b928;color:#12233b;font-weight:bold}</style></head><body><main><header><b>💎 MINES</b><div class="wallet">🪙 ₹<span id="balance">—</span></div></header><section class="board"><div class="top"><div style="display:flex;align-items:center;gap:5px;font-size:12px">Mines <div class="mine-select"><button type="button" id="mines" data-value="3" onclick="toggleMines()">3 ▾</button><div id="mineOptions" class="mine-options" hidden></div></div></div><span>Next: <b id="nextX">1.00x</b></span></div><div class="grid" id="grid"></div></section><div id="message">Choose your bet amount</div><section class="panel"><label>BET AMOUNT (₹)</label><input id="amount" type="number" value="50" min="1" max="10000" step="0.01"><div class="actions"><button class="action" id="play" onclick="start()">PLAY</button><button class="action cash" id="cash" onclick="cashOut()" disabled>CASH OUT</button></div><p>Multiplier: <b id="mult">1.00x</b> · Return: ₹<b id="return">0.00</b></p></section><footer>Color Win wallet · Bet ₹1–₹10,000 · Mines</footer></main><script>
const $=id=>document.getElementById(id);let round=null,balance=null,busy=true,startKey=null;const pending=new Map();
function call(action,data={}){return new Promise((resolve,reject)=>{const key=crypto.randomUUID();const timer=setTimeout(()=>{pending.delete(key);reject(Error('Connection timed out. Reload to recover your round.'));},15000);pending.set(key,{resolve,reject,timer});parent.postMessage({type:'cw-mines-request',key,action,data},'*');});}
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='cw-mines-response')return;const p=pending.get(event.data.key);if(!p)return;clearTimeout(p.timer);pending.delete(event.data.key);event.data.error?p.reject(Error(event.data.error)):p.resolve(event.data.result);});
function paint(){const active=round?.status==='active',opened=round?.opened||[],mines=round?.mines||[];$('grid').innerHTML='';for(let i=0;i<25;i++){const tile=document.createElement('button');tile.type='button';tile.className='tile'+(opened.includes(i)?' open':'')+(mines.includes(i)?' bomb':'');tile.textContent=mines.includes(i)?'💣':opened.includes(i)?'★':'●';tile.setAttribute('aria-label','Tile '+(i+1));tile.disabled=busy||!active||opened.includes(i);tile.onclick=()=>pick(i);$('grid').append(tile);}
$('balance').textContent=balance===null?'—':Number(balance).toFixed(2);$('mult').textContent=Number(round?.multiplier||1).toFixed(2)+'x';$('return').textContent=Number(active?round.bet*round.multiplier:round?.payout||0).toFixed(2);$('nextX').textContent=Number(active?round.next_multiplier:1).toFixed(2)+'x';$('play').disabled=busy||active||balance===null;$('cash').disabled=busy||!active||!opened.length;$('mines').disabled=busy||active;$('amount').disabled=busy||active;if(active){$('mineOptions').hidden=true;$('amount').value=round.bet;$('mines').dataset.value=round.mine_count;$('mines').textContent=round.mine_count+' ▾';}}
async function execute(action,data={}){if(busy&&action!=='load')return;busy=true;paint();try{const result=await call(action,data);balance=result.balance;round=result.round;if(action==='start')startKey=null;$('message').textContent=round?.status==='lost'?'Mine hit. Bet lost.':round?.status==='cashed'?'Cash out successful: ₹'+Number(round.payout).toFixed(2):round?.status==='active'?'Choose a safe tile or cash out.':'Choose your bet amount and press PLAY.';}catch(error){$('message').textContent=error.message;try{const state=await call('load');balance=state.balance;round=state.round;}catch{balance=null;}}finally{busy=false;paint();}}
function start(){const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<1||amount>10000||amount>balance){$('message').textContent='Enter ₹1–₹10,000 within your wallet balance.';return;}startKey=startKey||crypto.randomUUID();execute('start',{amount,mines:Number($('mines').dataset.value),request_id:startKey});}
function pick(tile){if(round?.status==='active')execute('pick',{id:round.id,tile});}
function cashOut(){if(round?.status==='active')execute('cash',{id:round.id});}
function toggleMines(){if(!busy&&round?.status!=='active')$('mineOptions').hidden=!$('mineOptions').hidden;}
function chooseMine(n){if(busy||round?.status==='active')return;$('mines').dataset.value=n;$('mines').textContent=n+' ▾';$('mineOptions').hidden=true;document.querySelectorAll('#mineOptions button').forEach(b=>b.classList.toggle('chosen',Number(b.textContent)===n));}
$('mineOptions').innerHTML=[1,3,5,7,10,15,20,24].map(n=>'<button type="button" onclick="chooseMine('+n+')">'+n+'</button>').join('');document.addEventListener('click',e=>{if(!e.target.closest('.mine-select'))$('mineOptions').hidden=true;});paint();$('message').textContent='Loading your wallet and round…';execute('load');
</script></body></html>
