<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avitaro Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e0e12;color:#eee;font:14px Arial,sans-serif}header{background:#1b1b21;padding:14px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900;font-style:italic;color:#f03751}.wallet{color:#4de36b}button,input{font:inherit}button{cursor:pointer}main{max-width:600px;margin:auto;padding:9px}.history{display:flex;gap:7px;overflow:auto;padding:12px 0}.history span{white-space:nowrap;border-radius:20px;padding:6px 10px;background:#272631;color:#b99cff}.meta{display:flex;justify-content:space-between;color:#aaa;font-size:12px;margin:5px}.game{height:300px;position:relative;overflow:hidden;border:2px solid #38333e;border-radius:22px;background:repeating-conic-gradient(from 0deg at 10% 100%,#29171e 0deg 13deg,#151317 13deg 26deg)}svg{position:absolute;inset:0;width:100%;height:100%}#curve{fill:none;stroke:#f42248;stroke-width:4;stroke-linecap:round}#area{fill:#ed183c;opacity:.3}.multi{position:absolute;top:24%;width:100%;text-align:center;font-size:60px;font-weight:900;text-shadow:0 3px 9px #000;z-index:2}.plane{position:absolute;left:8%;bottom:12%;font-size:66px;color:#f34;z-index:3;will-change:left,bottom,transform}.count{position:absolute;top:58%;width:100%;text-align:center;color:#ffc04e;font-size:22px;font-weight:bold;z-index:4}.bar{height:5px;background:#35343b;margin:9px;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#f5b04e;width:100%}.panel{background:#1d1e24;border:1px solid #303039;border-radius:13px;margin-top:10px;padding:13px}.tabs{display:flex;width:65%;margin:0 auto 13px;background:#111217;border-radius:25px;overflow:hidden}.tabs button{width:50%;border:0;background:none;color:#999;padding:8px}.tabs .selected{background:#393943;color:white;border-radius:25px}.betrow{display:flex;gap:10px}.left{width:44%}.right{width:56%}.amount{display:flex;align-items:center;justify-content:space-between;border-radius:25px;background:#0e0f12;padding:5px}.amount input{width:55%;min-width:0;text-align:center;color:white;background:none;border:0;outline:none;font-size:18px}.circle{border:1px solid #555;border-radius:50%;background:#272831;color:white;width:29px;height:29px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.quick button{border:0;border-radius:16px;background:#111217;color:#aaa;padding:6px}.action{height:94px;width:100%;border:2px solid #a4e68c;border-radius:23px;color:white;background:linear-gradient(#2bc500,#158b00);font-size:21px;font-weight:bold}.action.cash{background:linear-gradient(#fca526,#ce6c00);border-color:#ffce80}.action.cancel{background:linear-gradient(#f04a56,#aa1b2a);border-color:#ff9b9b}.action:disabled{opacity:.5}.auto{text-align:center;margin-top:10px;color:#aaa}.auto input{width:75px;border:1px solid #555;background:#111;color:white;padding:6px;border-radius:7px}.records{background:#1d1e24;margin-top:13px;padding:12px;border-radius:12px}.record{display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 0;border-bottom:1px solid #35353d;font-size:12px}.record span:last-child{text-align:right}.green{color:#4cdb6b}.red{color:#ff556a}.notice{text-align:center;color:#888;font-size:11px;padding:16px}.blast{animation:explode .65s ease-out forwards}@keyframes explode{0%{transform:scale(1);opacity:1}55%{transform:scale(2);opacity:1}100%{transform:scale(3);opacity:0}}.flyaway{transition:left .65s ease-in,bottom .65s ease-in,transform .65s ease-in!important;left:120%!important;bottom:115%!important;transform:rotate(-25deg) scale(.7)}
header .sound{background:#333;color:#fff;border:1px solid #555;border-radius:8px;padding:6px;margin-left:6px}body{overflow-x:hidden}button:focus-visible,input:focus-visible{outline:2px solid #67b6ff;outline-offset:2px}@media(max-width:350px){main{padding:6px}.panel{padding:9px}.betrow{gap:6px}.action{font-size:17px}.circle{width:24px;height:24px}.amount input{font-size:15px}}</style></head><body><header><div class="logo">✈ AVIATOR</div><div class="wallet">₹<span id="balance">—</span>  <button class="sound" id="soundBtn" onclick="toggleSound()">🔊</button></div></header><main><div class="history" id="history"></div><div class="meta"><span>Round #<span id="roundId"></span></span><span id="phase">Waiting</span></div><div class="game" id="game"><svg viewBox="0 0 400 300" preserveAspectRatio="none"><path id="area"/><path id="curve"/></svg><div class="multi" id="multi">1.00x</div><div class="plane" id="plane">✈</div><div class="count" id="count"></div></div><div class="bar"><div id="progress"></div></div><div id="panels"></div><div class="records"><b>My Bets</b><div class="record"><span>Bet INR</span><span>Multiplier</span><span>Cash Out INR</span></div><div id="records"></div></div><div class="notice">Color Win wallet · Bet ₹1–₹10,000 · Server-generated rounds</div></main><script src="arcade-client.js?v=1"></script><script>const $=id=>document.getElementById(id);
let audioCtx=null,soundOn=true,engine=null,engineGain=null,engineNoise=null,engineFilter=null,lastBeep=-1;
function initAudio(){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
document.addEventListener('pointerdown',initAudio,{passive:true});
function tone(freq,duration=.12,type='sine',volume=.065,slide=null){if(!soundOn||!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),t+duration);g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}
function noiseBurst(duration=.5,volume=.13,from=1800,to=120){
 if(!soundOn||!audioCtx)return;
 const rate=audioCtx.sampleRate,buf=audioCtx.createBuffer(1,Math.ceil(rate*duration),rate),data=buf.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1);
 let src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain(),t=audioCtx.currentTime;
 src.buffer=buf;f.type='lowpass';f.frequency.setValueAtTime(from,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,to),t+duration);
 g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(volume,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+duration);
 src.connect(f).connect(g).connect(audioCtx.destination);src.start(t);src.stop(t+duration);
}
function whoosh(){
 if(!soundOn||!audioCtx)return;
 const t=audioCtx.currentTime;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type='sine';o.frequency.setValueAtTime(220,t);
 o.frequency.exponentialRampToValueAtTime(720,t+.45);
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(.035,t+.12);
 g.gain.exponentialRampToValueAtTime(.0001,t+.58);
 o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.6);
}
function explosion(){
 if(!soundOn||!audioCtx)return;
 const t=audioCtx.currentTime;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type='sine';o.frequency.setValueAtTime(105,t);
 o.frequency.exponentialRampToValueAtTime(34,t+.48);
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(.085,t+.035);
 g.gain.exponentialRampToValueAtTime(.0001,t+.65);
 o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.68);
}
function startEngine(){
 // No continuous oscillator: avoids buzzing and crackling on phones.
 if(!soundOn||!audioCtx)return;
 tone(330,.22,'sine',.035,440);
 setTimeout(()=>tone(494,.28,'sine',.028,660),140);
}
function stopEngine(){}
function toggleSound(){soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn){initAudio();tone(660)}else stopEngine()}

let balance=null,multi=1,state='waiting',server=null,busy=false,lastUpdate=0,offset=0;const bets=[{amount:10,auto:false,target:2},{amount:10,auto:false,target:2}],keys=[null,null];const money=n=>Number(n).toFixed(2);
function error(t){$('phase').textContent=t;}
function entry(i){return server?.bets?.find(b=>b.slot===i&&b.status!=='cancelled');}
function renderPanels(){$('panels').innerHTML=bets.map((b,i)=>`<div class="panel"><div class="tabs"><button onclick="setAuto(${i},false)" class="${!b.auto?'selected':''}">Bet</button><button onclick="setAuto(${i},true)" class="${b.auto?'selected':''}">Auto</button></div><div class="betrow"><div class="left"><div class="amount"><button class="circle" onclick="changeAmount(${i},-10)">−</button><input id="amount${i}" type="number" min="1" max="10000" value="${b.amount}" onchange="setAmount(${i},this.value)"><button class="circle" onclick="changeAmount(${i},10)">+</button></div><div class="quick">${[10,100,500,1000].map(n=>`<button onclick="quickAmount(${i},${n})">${n}</button>`).join('')}</div></div><div class="right"><button class="action" id="action${i}" onclick="action(${i})">BET</button></div></div>${b.auto?`<div class="auto">Auto Cash Out <input type="number" min="1.01" max="50" step=".01" value="${b.target}" onchange="setTarget(${i},this.value)"> x</div>`:''}</div>`).join('');update();}
function setAuto(i,v){if(entry(i)?.status==='active'||busy)return;bets[i].auto=v;renderPanels();}function setTarget(i,v){if(entry(i)?.status==='active'||busy)return;bets[i].target=Math.min(50,Math.max(1.01,Number(v)||2));}function setAmount(i,v){if(entry(i)?.status==='active'||busy)return;bets[i].amount=Math.min(10000,Math.max(1,Number(v)||1));}function changeAmount(i,d){setAmount(i,bets[i].amount+d);renderPanels();}function quickAmount(i,n){setAmount(i,n);renderPanels();}
function update(){$('balance').textContent=balance===null?'—':money(balance);$('multi').textContent=multi.toFixed(2)+'x';for(let i=0;i<2;i++){const b=entry(i),btn=$('action'+i);if(!btn)continue;btn.className='action';btn.disabled=busy||!server;const input=$('amount'+i);input.disabled=busy||b?.status==='active';if(b?.status==='cashed'){btn.textContent='CASHED OUT';btn.disabled=true;}else if(state==='waiting'){btn.innerHTML=(b?.status==='active'?'CANCEL<br>':'BET<br>')+money(b?.amount||bets[i].amount)+' INR';if(b?.status==='active')btn.classList.add('cancel');}else if(state==='flying'&&b?.status==='active'){btn.classList.add('cash');btn.innerHTML='CASH OUT<br>'+money(b.amount*multi)+' INR';}else{btn.textContent='WAIT';btn.disabled=true;}}}
function paint(d){balance=Number(d.balance);if(server?.id!==d.round.id){keys[0]=null;keys[1]=null;}server=d.round;for(const b of server.bets||[])if(b.status!=='cancelled')keys[b.slot]=null;offset=new Date(server.now).getTime()-Date.now();state=server.phase;multi=Number(server.multiplier);$('roundId').textContent=server.id.slice(0,8);$('phase').textContent=state==='waiting'?'Place your bets':state==='flying'?'Flying':'FLEW AWAY';$('multi').style.color=state==='crashed'?'#ff3555':'white';$('count').style.display=state==='flying'?'none':'block';$('count').textContent=state==='waiting'?'Starting in '+Math.max(0,Math.ceil((new Date(server.starts_at).getTime()-Date.now()-offset)/1000))+'s':'FLEW AWAY';$('records').innerHTML=(d.history||[]).map(r=>'<div class="record"><span>'+money(r.amount)+'</span><span class="'+(r.payout?'green':'red')+'">'+(r.payout?Number(r.result).toFixed(2)+'x':'Lost')+'</span><span>'+money(r.payout)+'</span></div>').join('');$('history').innerHTML=(d.history||[]).slice(0,15).map(r=>'<span>'+Number(r.result).toFixed(2)+'x</span>').join('');update();}
async function request(action,data={}){if(busy)return;busy=true;update();try{paint(await CWArcade('aviator',action,data));if(action==='bet')keys[data.slot]=null;}catch(e){error(e.message);}finally{busy=false;update();}}
function action(i){if(busy||!server)return;const b=entry(i);if(state==='waiting'&&b?.status==='active')request('cancel',{id:b.id});else if(state==='flying'&&b?.status==='active')request('cash',{id:b.id});else if(state==='waiting'){const amount=Number($('amount'+i).value);if(!Number.isFinite(amount)||amount<1||amount>10000||amount>balance){error('Invalid amount or insufficient wallet balance');return;}keys[i]=keys[i]||crypto.randomUUID();request('bet',{flight_id:server.id,slot:i,amount,auto_target:bets[i].auto?bets[i].target:null,request_id:keys[i]});}}
function animate(){if(server){const elapsed=Math.max(0,(Date.now()+offset-new Date(server.starts_at).getTime())/1000),p=state==='waiting'?0:Math.min(elapsed/18,.95);if(state==='flying')multi=Math.floor(Math.exp(elapsed*.18)*100)/100;const plane=$('plane');plane.style.left=8+p*75+'%';plane.style.bottom=12+Math.pow(p,.72)*65+'%';const x=32+p*300,y=264-Math.pow(p,.72)*195,path=`M32 264 Q${x*.55} 260 ${x} ${y}`;$('curve').setAttribute('d',path);$('area').setAttribute('d',path+` L${x} 264 L32 264 Z`);if(state==='waiting'){$('count').textContent='Starting in '+Math.max(0,Math.ceil(-elapsed+(new Date(server.starts_at).getTime()-Date.now()-offset)/1000))+'s';$('progress').style.width=Math.max(0,Math.min(100,(new Date(server.starts_at).getTime()-Date.now()-offset)/100))+'%';}update();}requestAnimationFrame(animate);}
renderPanels();request('load');setInterval(()=>{if(!document.hidden)request('load');},500);requestAnimationFrame(animate);
</script></body></html>
