<svg xmlns="http://www.w3.org/2000/svg"
     width="663" height="461" viewBox="0 0 663 461"
     fill="none" role="img" aria-label="Detailed red airplane">
  <defs>
    <linearGradient id="body" x1="150" y1="410" x2="490" y2="170"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#BB1420"/>
      <stop offset=".4" stop-color="#F32729"/>
      <stop offset=".75" stop-color="#FF4035"/>
      <stop offset="1" stop-color="#FF6350"/>
    </linearGradient>

    <linearGradient id="blade" x1="-15" y1="0" x2="16" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#8F171D"/>
      <stop offset=".2" stop-color="#D72627"/>
      <stop offset=".48" stop-color="#FF5945"/>
      <stop offset=".7" stop-color="#F3352B"/>
      <stop offset="1" stop-color="#9F1920"/>
    </linearGradient>

    <linearGradient id="hub" x1="557" y1="155" x2="598" y2="180"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9473"/>
      <stop offset=".35" stop-color="#FF4E37"/>
      <stop offset=".7" stop-color="#D92725"/>
      <stop offset="1" stop-color="#85151C"/>
    </linearGradient>

    <linearGradient id="edge" x1="170" y1="245" x2="425" y2="270"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9A7C"/>
      <stop offset="1" stop-color="#FFD0AD"/>
    </linearGradient>

    <!-- One blade, duplicated around a shared mechanical axis -->
    <g id="propeller-blade">
      <path d="M-6-5
               C-10-24-15-51-15-80
               C-15-111-11-139-5-152
               Q-2-160 2-152
               C10-133 15-108 14-82
               C13-54 7-25 6-5Z"
            fill="url(#blade)"
            stroke="#8F2021" stroke-width="2"
            stroke-linejoin="round"/>

      <!-- Leading-edge reflection -->
      <path d="M-4-148
               C-10-124-11-101-10-78
               C-9-54-6-31-3-16"
            stroke="#FF9A73" stroke-width="2"
            stroke-linecap="round" opacity=".8"/>

      <!-- Blade face -->
      <path d="M0-142
               C8-119 10-99 8-79
               C7-59 3-38 2-26
               C0-60 2-103 0-142Z"
            fill="#FF674B" opacity=".55"/>

      <!-- Dark tip detail follows the blade curvature -->
      <path d="M-3-151
               Q0-157 3-146
               Q9-128 11-111
               Q3-127-3-151Z"
            fill="#771820" opacity=".85"/>

      <path d="M-6-10 6-10 5-1-5-1Z"
            fill="#A32022"/>
    </g>
  </defs>

  <!-- Airframe -->
  <path fill="url(#body)" fill-rule="evenodd"
        stroke="#AD2525" stroke-width="2.2"
        stroke-linejoin="round"
        d="
        M15 385
        L16 371 48 353 49 347 21 359 22 351
        Q46 333 59 333
        Q68 332 79 343
        L119 367 Q138 379 154 367
        L247 311 252 306 246 306
        L194 333 205 318 202 308 146 338
        L150 316 202 285 204 280 198 277
        L179 284 154 261 176 244
        Q185 238 203 240
        L424 253 Q436 253 433 265
        Q451 278 467 269
        L550 221 559 227 564 222
        L535 158 Q531 151 522 156
        L417 200 375 225 359 236 305 237
        L305 226 Q308 214 324 206
        L371 174 Q385 167 399 173
        L413 179 Q425 181 438 175
        L515 147 Q538 140 548 150
        Q570 182 579 215
        Q583 231 575 240
        L542 263 Q497 292 437 316
        L145 437 109 449 98 440 88 442 80 434
        Q84 429 98 426
        L218 378 365 314 432 286
        L412 285 398 289 389 295 379 296
        L258 357 241 347 112 411
        L111 402 128 389 109 385 67 368
        Q60 365 60 375
        L96 413 87 417 44 375 Z

        M204 247
        L408 273 Q423 275 426 260 Z

        M327 214
        L339 201 359 190
        Q370 186 381 192
        L346 216 Z

        M380 178
        Q387 174 396 179
        L415 186 389 205 383 202
        L399 190 382 185
        Q375 182 380 178 Z"/>

  <!-- Lower fuselage bevel -->
  <path d="M91 434
           Q220 388 365 327
           Q495 278 568 234"
        stroke="#951B24" stroke-width="4"
        stroke-linecap="round" opacity=".6"/>

  <!-- Wing edge highlight -->
  <path d="M181 245
           Q194 242 212 245
           L421 257"
        stroke="url(#edge)" stroke-width="2.8"
        stroke-linecap="round"/>

  <path d="M164 261 181 277"
        stroke="#FF7760" stroke-width="2"
        stroke-linecap="round"/>

  <!-- Cowling and cockpit rim -->
  <path d="M311 226
           Q314 216 328 210
           L375 179 Q385 173 398 179"
        stroke="#FF8B71" stroke-width="2"
        stroke-linecap="round"/>

  <path d="M443 177 518 151
           Q533 146 541 154"
        stroke="#FFAD87" stroke-width="2.3"
        stroke-linecap="round"/>

  <!-- Side markings -->
  <path d="M385 236 462 198 477 213 461 245Z"
        fill="#F6322B"/>
  <path d="m474 189 12-6 3 9 11-23-5 33
           15 17-7 4-10-7-7 18-12 5 11-29Z"
        fill="#E92525" stroke="#B72B27" stroke-width="1.4"/>

  <!-- Tail surface detail -->
  <path d="M28 350 Q50 336 60 339
           Q65 339 73 345"
        stroke="#FF7963" stroke-width="2"
        stroke-linecap="round"/>
  <path d="m51 376 34 34"
        stroke="#8F1D25" stroke-width="2"
        opacity=".55"/>

  <!-- Nose collar behind propeller -->
  <path d="M548 159
           Q559 155 567 161
           L579 186
           Q576 195 568 199Z"
        fill="#B92727" stroke="#8F2021" stroke-width="2"/>
  <path d="m554 162 16 29"
        stroke="#FF8B66" stroke-width="3"
        stroke-linecap="round"/>

  <!-- Balanced two-blade propeller, tilted to match reference -->
  <g transform="translate(579 169) rotate(-25)">
    <use href="#propeller-blade"/>
    <use href="#propeller-blade" transform="rotate(180)"/>

    <!-- Blade root mounting plate -->
    <ellipse rx="12" ry="15"
             fill="#912029" stroke="#641820" stroke-width="2"/>
    <ellipse rx="8" ry="11" fill="#E83B30"/>
  </g>

  <!-- Spinner projects forward along the fuselage axis -->
  <path d="M563 159
           Q568 153 577 154
           L600 155
           Q606 157 602 162
           L582 180
           Q577 184 572 177Z"
        fill="url(#hub)"
        stroke="#9C2023" stroke-width="2"
        stroke-linejoin="round"/>

  <path d="M568 158 Q581 155 598 158"
        stroke="#FFC09A" stroke-width="2"
        stroke-linecap="round"/>

  <path d="m577 177 21-17-19 8Z"
        fill="#B22223" opacity=".75"/>

  <!-- Small nose fasteners -->
  <g fill="#8E2023">
    <circle cx="552" cy="172" r="1.5"/>
    <circle cx="558" cy="184" r="1.5"/>
    <circle cx="564" cy="196" r="1.5"/>
  </g>
</svg>